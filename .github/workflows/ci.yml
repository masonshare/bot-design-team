name: ci
on:
  pull_request:
    branches: [main]
  push:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Failing-case tests
        run: bash scripts/tests/run.sh
      - name: CI checks
        run: sh scripts/ci.sh
